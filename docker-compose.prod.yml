
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    environment:
      ENV: ${ENV}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SITE_URL: ${SITE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      LEGAL_DOCUMENTS_DIR: /srv/legal_documents
      TZ: UTC
    expose:
      - "8000"
    volumes:
      - legal_archive:/srv/legal_documents
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1500m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - legal_archive:/srv/legal_documents:ro
    restart: unless-stopped
    mem_limit: 192m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine
    depends_on:
      - db
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP: "3"
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      TZ: UTC
    volumes:
      - pcm_backups:/backups
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[backup] avviato. KEEP=$$KEEP, dest=/backups"
        if ! command -v age >/dev/null 2>&1; then
          echo "[backup] installazione age in corso..."
          apk add --no-cache age >/dev/null
        fi
        until pg_isready -q; do
          echo "[backup] DB non pronto, attendo 5s..."
          sleep 5
        done
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S)
          if [ -n "$${BACKUP_AGE_RECIPIENT:-}" ]; then
            out="/backups/pcm-$$ts.dump.age"
            tmp="$$out.partial"
            echo "[backup] $$(date -Iseconds) inizio dump cifrato -> $$out"
            if pg_dump -F c | age -r "$$BACKUP_AGE_RECIPIENT" -o "$$tmp"; then
              mv "$$tmp" "$$out"
              echo "[backup] $$(date -Iseconds) dump cifrato ok ($$(stat -c%s "$$out") bytes)"
            else
              rm -f "$$tmp"
              echo "[backup] $$(date -Iseconds) DUMP CIFRATO FALLITO"
            fi
          else
            out="/backups/pcm-$$ts.dump"
            tmp="$$out.partial"
            echo "[backup] WARNING: BACKUP_AGE_RECIPIENT non impostato -> dump in chiaro"
            echo "[backup] $$(date -Iseconds) inizio dump -> $$out"
            if pg_dump -F c -f "$$tmp"; then
              mv "$$tmp" "$$out"
              echo "[backup] $$(date -Iseconds) dump ok ($$(stat -c%s "$$out") bytes)"
            else
              rm -f "$$tmp"
              echo "[backup] $$(date -Iseconds) DUMP FALLITO"
            fi
          fi
          ls -1t /backups/pcm-*.dump /backups/pcm-*.dump.age 2>/dev/null | tail -n +$$((KEEP+1)) | xargs -r rm -f
          echo "[backup] $$(date -Iseconds) prossimo dump tra 7 giorni"
          sleep 604800
        done
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cleaner:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[cleaner] avviato (solo immagini dangling + build cache orfana; mai container/volumi). Primo giro tra 1h."
        sleep 3600
        while true; do
          echo "[cleaner] $$(date -Iseconds) prune immagini dangling..."
          docker image prune -f || echo "[cleaner] image prune fallito (ignoro)"
          echo "[cleaner] $$(date -Iseconds) prune build cache orfana (NON quella in uso)..."
          docker builder prune -f || echo "[cleaner] builder prune fallito (ignoro)"
          echo "[cleaner] $$(date -Iseconds) fatto. Prossimo giro tra 24h."
          sleep 86400
        done
    mem_limit: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  pcm_backups:
  legal_archive:
