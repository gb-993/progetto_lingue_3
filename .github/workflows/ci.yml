# CI: test backend + build/lint frontend.
#
# Gira a ogni push/PR su main. Non fa deploy: verifica solo che il codice
# sia sano. Il deploy resta manuale (build di frontend/dist sul PC +
# redeploy stack da Portainer, vedi docker-compose.prod.yml).
#
# I test backend usano SQLite in-memory (vedi backend/tests/conftest.py),
# quindi NON serve un servizio Postgres qui.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Allineata al backend/Dockerfile (python:3.12-slim).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    # NON bloccante: al momento ci sono ~46 errori eslint preesistenti
    # (in gran parte regole react-hooks sui componenti grossi). Quando
    # verranno ripuliti, togliere questo flag per rendere il job bloccante.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint
